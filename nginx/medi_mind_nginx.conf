# nginx/medi_mind_nginx.conf
#
# Reverse proxy for MediMind. Gunicorn serves the app on 127.0.0.1:8000;
# nginx terminates client connections and serves static files directly.
#
# Set MEDIMIND_ROOT below to the deployed project directory.

upstream medimind_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;  # replace with your domain

    client_max_body_size 2M;

    access_log /var/log/nginx/medimind_access.log;
    error_log  /var/log/nginx/medimind_error.log;

    # Static assets are served by nginx, never proxied.
    location /static/ {
        alias /srv/medimind/app/static/;
        expires 30d;
        access_log off;
    }

    location = /favicon.ico {
        alias /srv/medimind/app/static/images/MediMindLogo.png;
        access_log off;
    }

    # Everything else goes to the application server.
    location / {
        proxy_pass http://medimind_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
